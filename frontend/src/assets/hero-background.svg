<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#211B12"/>
      <stop offset="55%" stop-color="#15130F"/>
      <stop offset="100%" stop-color="#0B0A07"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#C97A34" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#C97A34" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#C97A34" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="copperFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C97A34"/>
      <stop offset="100%" stop-color="#8F4E15"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B2416"/>
      <stop offset="100%" stop-color="#1C1810"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- faint house silhouette, far background, right side -->
  <g opacity="0.5">
    <path d="M980 640 L980 420 L1150 300 L1320 420 L1320 640 Z" fill="none" stroke="#4A3E28" stroke-width="2"/>
    <path d="M950 440 L1150 280 L1350 440" fill="none" stroke="#4A3E28" stroke-width="2"/>
    <rect x="1030" y="500" width="60" height="80" fill="none" stroke="#4A3E28" stroke-width="2"/>
    <rect x="1210" y="500" width="60" height="80" fill="none" stroke="#4A3E28" stroke-width="2"/>
  </g>

  <!-- fine circuit trace connecting the scene -->
  <path d="M700 760 C 820 760, 840 660, 950 660 S 1080 560, 1190 560 S 1300 470, 1400 470"
        fill="none" stroke="#B5651D" stroke-width="1.5" stroke-dasharray="1 10" opacity="0.55"/>
  <circle cx="700" cy="760" r="4" fill="#B5651D" opacity="0.7"/>
  <circle cx="950" cy="660" r="4" fill="#B5651D" opacity="0.7"/>
  <circle cx="1190" cy="560" r="4" fill="#B5651D" opacity="0.7"/>

  <!-- open switchboard panel -->
  <g transform="translate(1080,470)">
    <rect x="-70" y="-90" width="150" height="190" rx="8" fill="url(#panelFill)" stroke="#5A4A2E" stroke-width="2"/>
    <rect x="-50" y="-70" width="45" height="45" rx="4" fill="none" stroke="#C97A34" stroke-width="1.6"/>
    <rect x="5" y="-70" width="45" height="45" rx="4" fill="none" stroke="#C97A34" stroke-width="1.6"/>
    <rect x="-50" y="-14" width="45" height="45" rx="4" fill="none" stroke="#8F4E15" stroke-width="1.6"/>
    <rect x="5" y="-14" width="45" height="45" rx="4" fill="none" stroke="#C97A34" stroke-width="1.6"/>
    <line x1="-50" y1="60" x2="50" y2="60" stroke="#5A4A2E" stroke-width="1.5"/>
    <path d="M-50 60 Q -70 90 -40 100" fill="none" stroke="#C97A34" stroke-width="1.6" opacity="0.8"/>
    <path d="M50 60 Q 75 85 60 110" fill="none" stroke="#8F4E15" stroke-width="1.6" opacity="0.8"/>
  </g>

  <!-- technician figure, kneeling, working on the panel -->
  <g transform="translate(870,760)">
    <!-- shadow -->
    <ellipse cx="10" cy="8" rx="120" ry="14" fill="#000000" opacity="0.35"/>
    <!-- back leg -->
    <path d="M-40 -20 L-70 60 L-30 60" fill="none" stroke="#3A2F1D" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- front leg, kneeling -->
    <path d="M20 -10 L10 40 L70 40" fill="none" stroke="#4A3D24" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- torso -->
    <path d="M-40 -20 C -55 -90, -10 -150, 40 -140 C 60 -100, 55 -55, 20 -10 Z" fill="url(#copperFill)" opacity="0.9"/>
    <!-- arm reaching up to panel -->
    <path d="M25 -110 C 60 -140, 100 -170, 150 -190" fill="none" stroke="#4A3D24" stroke-width="16" stroke-linecap="round"/>
    <circle cx="152" cy="-192" r="9" fill="#C97A34"/>
    <!-- other arm, holding tool -->
    <path d="M0 -60 C -30 -50, -55 -30, -60 5" fill="none" stroke="#4A3D24" stroke-width="16" stroke-linecap="round"/>
    <rect x="-78" y="0" width="14" height="46" rx="4" fill="#8F4E15" transform="rotate(18 -71 23)"/>
    <!-- head -->
    <circle cx="10" cy="-165" r="26" fill="#5A4A2E"/>
    <!-- hard hat -->
    <path d="M-16 -175 A 26 20 0 0 1 36 -175 Z" fill="#C97A34"/>
    <rect x="-20" y="-177" width="60" height="7" rx="3" fill="#8F4E15"/>
  </g>

  <!-- toolbox beside technician -->
  <g transform="translate(700,800)">
    <rect x="0" y="0" width="90" height="52" rx="6" fill="url(#panelFill)" stroke="#5A4A2E" stroke-width="2"/>
    <path d="M18 0 V-18 Q18 -30 45 -30 Q72 -30 72 -18 V0" fill="none" stroke="#5A4A2E" stroke-width="4"/>
    <line x1="0" y1="20" x2="90" y2="20" stroke="#5A4A2E" stroke-width="2"/>
    <circle cx="45" cy="20" r="4" fill="#C97A34"/>
  </g>

  <!-- floating bolt mark, upper right, brand moment -->
  <g transform="translate(1400,190) scale(3.4)" opacity="0.9">
    <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#C97A34"/>
  </g>
  <g transform="translate(1400,190) scale(3.4)">
    <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="none" stroke="#F1CFA0" stroke-width="0.4" opacity="0.5"/>
  </g>

  <!-- floating wrench + plug, small accent icons -->
  <g transform="translate(1230,700)" opacity="0.7">
    <path d="M18 4 A9 9 0 1 0 24 20 L38 34 L34 38 L20 24 A9 9 0 0 0 18 4Z" fill="none" stroke="#C97A34" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
  <g transform="translate(560,560)" opacity="0.6">
    <rect x="0" y="8" width="26" height="18" rx="3" fill="none" stroke="#8F4E15" stroke-width="2"/>
    <line x1="6" y1="8" x2="6" y2="0" stroke="#8F4E15" stroke-width="2"/>
    <line x1="20" y1="8" x2="20" y2="0" stroke="#8F4E15" stroke-width="2"/>
    <line x1="26" y1="17" x2="34" y2="17" stroke="#8F4E15" stroke-width="2"/>
  </g>

  <!-- grid texture, subtle -->
  <g opacity="0.05">
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#FFFFFF" stroke-width="0.5"/>
    </pattern>
    <rect width="1600" height="900" fill="url(#grid)"/>
  </g>
</svg>
